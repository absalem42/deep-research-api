version: 2

# Grouped so a quiet week produces one PR per ecosystem rather than a dozen.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns: ["langchain*", "langgraph*"]
      dev-dependencies:
        patterns: ["pytest*", "ruff", "fakeredis"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "react", "react-dom", "@types/react*"]

  - package-ecosystem: npm
    directory: /clients/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
