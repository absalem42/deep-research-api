<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Deep Research">
  <title>Deep Research</title>

  <!-- Square mark for favicons, avatars and social cards. Same idea as the
       full logo, tightened so it still reads at 32px. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95">
    <path d="M30 64 C46 64, 46 34, 66 34"/>
    <path d="M30 64 H66"/>
    <path d="M30 64 C46 64, 46 94, 66 94"/>
  </g>

  <circle cx="30" cy="64" r="7.5" fill="#ffffff"/>
  <circle cx="74" cy="34" r="8.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="74" cy="64" r="8.5" fill="#ffffff"/>
  <circle cx="74" cy="94" r="8.5" fill="#ffffff" opacity="0.95"/>
</svg>
