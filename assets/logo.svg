<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="Deep Research API">
  <title>Deep Research API</title>

  <!-- The mark is the architecture: one question fans out to parallel
       researchers and converges into a single report. Colours are chosen to
       hold up on both light and dark README backgrounds without a media query,
       since GitHub strips those from inline SVG. -->

  <defs>
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#fan)" stroke-width="2.5" stroke-linecap="round">
    <!-- query -> supervisor -->
    <path d="M34 80 H72"/>
    <!-- supervisor -> three researchers -->
    <path d="M96 80 C120 80, 120 36, 150 36"/>
    <path d="M96 80 H150"/>
    <path d="M96 80 C120 80, 120 124, 150 124"/>
    <!-- researchers -> report -->
    <path d="M174 36 C204 36, 204 80, 228 80"/>
    <path d="M174 80 H228"/>
    <path d="M174 124 C204 124, 204 80, 228 80"/>
  </g>

  <!-- nodes -->
  <circle cx="26" cy="80" r="8" fill="#3b82f6"/>
  <circle cx="84" cy="80" r="12" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="162" cy="36" r="10" fill="#6366f1" opacity="0.9"/>
  <circle cx="162" cy="80" r="10" fill="#7c3aed" opacity="0.9"/>
  <circle cx="162" cy="124" r="10" fill="#6366f1" opacity="0.9"/>

  <!-- the report -->
  <g transform="translate(236 56)">
    <rect x="0" y="0" width="36" height="48" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <path d="M8 14 H28 M8 24 H28 M8 34 H20" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark: mid-grey reads on white and on GitHub's dark canvas alike -->
  <text x="300" y="74" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#64748b">Deep Research</text>
  <text x="300" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" font-weight="500" fill="#8b5cf6" letter-spacing="3.5">API</text>
</svg>
